# Orar Univer — static Mini App + reverse proxy to the API container.
# Included by /etc/nginx/nginx.conf inside the `http {}` block.
#
# Production layout: Internet -> host HTTPS proxy (Caddy, see deploy/Caddyfile)
# -> 127.0.0.1:${WEB_PORT} -> this nginx (port 80) -> api:3001.

# ---- http-level helpers -------------------------------------------------------

# Cache policy by path. Empty value = header not added (API sets its own).
map $uri $orar_cache_control {
  ~^/(api|telegram)/  "";
  ~^/assets/          "public, max-age=31536000, immutable";
  default             "no-cache";
}

# CSP only for the Mini App documents/assets; the API (helmet) sends its own.
# telegram-web-app.js comes from telegram.org; web.telegram.org embeds the app
# in an iframe (Desktop/mobile clients use a webview, not a frame).
map $uri $orar_csp {
  ~^/(api|telegram)/  "";
  default             "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://telegram.org https://*.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org";
}

# Keep the scheme set by the TLS-terminating proxy in front of us.
map $http_x_forwarded_proto $orar_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  client_max_body_size 1m;

  # Real client IP from the host reverse proxy / Docker bridge (private ranges only).
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from ::1;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml application/manifest+json;

  # Security headers. IMPORTANT: every add_header lives in this server block only.
  # A location that declares its own add_header would silently drop all of these,
  # so per-path variation is done with the maps above instead.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy $orar_csp always;
  add_header Cache-Control $orar_cache_control;

  # Docker embedded DNS: re-resolve `api` so a recreated API container
  # (new IP) does not cause permanent 502s.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $orar_api http://api:3001;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $orar_forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Connection "";
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    # Avoid duplicates of headers helmet already sets on API responses.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_pass $orar_api;
  }

  location /telegram/ {
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_pass $orar_api;
  }

  # Hashed Vite bundles: never fall back to index.html (would be cached as JS).
  location /assets/ {
    access_log off;
    try_files $uri =404;
  }

  # Hidden files (.git, .env, ...) are never served.
  location ~ /\. {
    return 404;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
