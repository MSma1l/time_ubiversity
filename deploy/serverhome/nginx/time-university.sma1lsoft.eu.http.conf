# Orar Univer on serverhome, STEP 1 (before the certificate exists).
# Copy to /srv/proxy/conf.d/time-university.sma1lsoft.eu.conf (inside `nginx_proxy`).
# Port 80 only: answers the Let's Encrypt HTTP-01 challenge from the certbot webroot and sends
# everything else to HTTPS. After the certificate is issued, replace this file with
# time-university.sma1lsoft.eu.conf (same name in conf.d, so the two never coexist).

server {
  listen 80;
  server_name time-university.sma1lsoft.eu;
  server_tokens off;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
