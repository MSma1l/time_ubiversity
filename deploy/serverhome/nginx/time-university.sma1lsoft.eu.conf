# Orar Univer on serverhome, STEP 2 (certificate issued).
# /srv/proxy/conf.d/time-university.sma1lsoft.eu.conf inside `nginx_proxy`, replacing the
# .http.conf variant. The Mini App container `time-university-web` is reached over
# `shared-network`; it serves the static app and proxies /api/ and /telegram/ to the API.
#
# Deliberately NOT here:
#   - X-Frame-Options: web.telegram.org embeds the Mini App in an iframe; SAMEORIGIN (from the
#     template) would break it. The inner nginx sends CSP `frame-ancestors` for Telegram instead.
#   - CSP, X-Content-Type-Options, Referrer-Policy: already sent by the inner nginx / helmet.
#   - /etc/nginx/snippets/proxy-headers.conf: it uses $connection_upgrade, which has no `map`
#     in conf.d (no WebSocket needed).

server {
  listen 80;
  server_name time-university.sma1lsoft.eu;
  server_tokens off;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  # nginx >= 1.25.1 prefers `listen 443 ssl;` + `http2 on;`; this form still works (with a warning).
  listen 443 ssl http2;
  server_name time-university.sma1lsoft.eu;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/time-university.sma1lsoft.eu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/time-university.sma1lsoft.eu/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # JSON API bodies only (the inner nginx caps at 1m too).
  client_max_body_size 1m;

  # PRECONDITION: both zones must already be declared in the proxy's own nginx.conf (http{} level,
  # they cannot live in conf.d). Without them `nginx -t` fails and the reload of the WHOLE proxy is
  # blocked, so every other site keeps its old config. See README.md, section 2:
  #   limit_req_zone  $binary_remote_addr zone=perip:10m rate=30r/s;
  #   limit_conn_zone $binary_remote_addr zone=peripconn:10m;
  limit_req zone=perip burst=60 nodelay;
  limit_conn peripconn 30;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    # Docker DNS, resolved per request: the proxy still starts while time-university-web is down.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $upstream http://time-university-web:80;
    proxy_pass $upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Edge proxy: overwrite (do not append) so clients cannot inject a fake address; the inner
    # nginx trusts private hops (set_real_ip_from 172.16.0.0/12) and the API trusts uniquelocal.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;
    proxy_redirect off;

    # HSTS: the inner nginx does not send it (only helmet does, on /api/ responses). Hide the
    # upstream copy and send exactly one on every response.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
